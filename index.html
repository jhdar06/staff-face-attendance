<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Staff Face Registration</title>

  <!-- Face API -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      color: #202124;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    .camera {
      width: 100%;
      aspect-ratio: 4 / 3;
      margin-top: 18px;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .guide {
      position: absolute;
      width: 58%;
      height: 72%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid white;
      border-radius: 50%;
      pointer-events: none;
    }

    .status {
      text-align: center;
      margin: 16px 0;
      font-weight: bold;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: none;
      border-radius: 10px;
      background: #1a73e8;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
    }

    button:disabled {
      background: #aaa;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #e6f4ea;
      color: #137333;
    }

    .error {
      display: block;
      background: #fce8e6;
      color: #b31412;
    }

    .warning {
      display: block;
      background: #fef7e0;
      color: #8a4b00;
    }

    .info {
      display: block;
      background: #e8f0fe;
      color: #174ea6;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>Staff Face Registration</h1>

    <p>
      Face Authentication Attendance System
    </p>

  </div>


  <div class="card">

    <label for="staffSelect">
      Select Staff Member
    </label>

    <select id="staffSelect">

      <option value="">
        Select staff member
      </option>

      <option value="T001">
        Javeed Ahmad Dar — Teacher
      </option>

    </select>


    <button id="loadModels">
      Load Face Recognition
    </button>


    <button id="startCamera"
            disabled>

      Start Camera

    </button>


    <div class="camera"
         id="cameraBox"
         style="display:none">

      <video id="video"
             autoplay
             muted
             playsinline>
      </video>

      <div class="guide"></div>

    </div>


    <div id="status"
         class="status">

      Face recognition is not loaded.

    </div>


    <button id="capture"
            disabled>

      Detect Face

    </button>


    <div id="message"
         class="message">
    </div>

  </div>

</div>


<script>
  const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzT-N64qGREd32KdznpyibHANy3VwJh25k2oeQ9hwVkLyAldKzDb5mB6ZHLXzvQ-DbC8A/exec";

const MODEL_URL =
  "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


const staffSelect =
  document.getElementById("staffSelect");

const loadModelsButton =
  document.getElementById("loadModels");

const startCameraButton =
  document.getElementById("startCamera");

const captureButton =
  document.getElementById("capture");

const video =
  document.getElementById("video");

const cameraBox =
  document.getElementById("cameraBox");

const status =
  document.getElementById("status");

const message =
  document.getElementById("message");


let modelsLoaded = false;
let cameraStream = null;


/* --------------------------------
   LOAD FACE MODELS
-------------------------------- */

loadModelsButton.addEventListener(
  "click",
  async function() {

    loadModelsButton.disabled = true;

    status.textContent =
      "Loading face recognition models...";

    clearMessage();

    try {

      await faceapi.nets.tinyFaceDetector.loadFromUri(
        MODEL_URL
      );

      await faceapi.nets.faceLandmark68TinyNet.loadFromUri(
        MODEL_URL
      );

      await faceapi.nets.faceRecognitionNet.loadFromUri(
        MODEL_URL
      );

      modelsLoaded = true;

      status.textContent =
        "Face recognition loaded.";

      showMessage(
        "Face recognition is ready.",
        "success"
      );

      startCameraButton.disabled = false;

    } catch (error) {

      console.error(error);

      loadModelsButton.disabled = false;

      status.textContent =
        "Model loading failed.";

      showMessage(
        "Could not load the face recognition models. Check your internet connection.",
        "error"
      );

    }

  }
);


/* --------------------------------
   START CAMERA
-------------------------------- */

startCameraButton.addEventListener(
  "click",
  async function() {

    if (!modelsLoaded) {

      showMessage(
        "Please load face recognition first.",
        "warning"
      );

      return;
    }

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: "user",
            width: {
              ideal: 640
            },
            height: {
              ideal: 480
            }
          },

          audio: false

        });


      video.srcObject =
        cameraStream;


      cameraBox.style.display =
        "block";


      startCameraButton.disabled =
        true;


      captureButton.disabled =
        false;


      status.textContent =
        "Camera ready. Position your face inside the oval.";

      clearMessage();


    } catch (error) {

      console.error(error);

      showMessage(
        "Camera access failed.",
        "error"
      );

    }

  }
);


/* --------------------------------
   DETECT FACE
-------------------------------- */

captureButton.addEventListener(
  "click",
  async function() {

    captureButton.disabled = true;

    status.textContent =
      "Looking for your face...";

    clearMessage();


    try {

      const detection =
        await faceapi
          .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks(true)
          .withFaceDescriptor();


      if (!detection) {

        status.textContent =
          "No face detected.";

        showMessage(
          "No face detected. Make sure your face is clearly visible and try again.",
          "warning"
        );

        captureButton.disabled =
          false;

        return;

      }


      const descriptor =
        Array.from(
          detection.descriptor
        );


      console.log(
  "Face descriptor:",
  descriptor
);

console.log(
  "Descriptor length:",
  descriptor.length
);

status.textContent =
  "Face detected. Saving registration...";

saveFaceDescriptor(descriptor);


    } catch (error) {

      console.error(error);

      status.textContent =
        "Face detection failed.";

      showMessage(
        error.message ||
        "Unable to process the face.",
        "error"
      );

      captureButton.disabled =
        false;

    }

  }
);


/* --------------------------------
   UI FUNCTIONS
-------------------------------- */

function showMessage(text, type) {

  message.textContent =
    text;

  message.className =
    "message " + type;

}


function clearMessage() {

  message.textContent =
    "";

  message.className =
    "message";

}
  function saveFaceDescriptor(descriptor) {

  const staffId =
    staffSelect.value;

  if (!staffId) {

    showMessage(
      "Please select a staff member.",
      "warning"
    );

    captureButton.disabled = false;

    return;
  }


  if (
    !Array.isArray(descriptor) ||
    descriptor.length !== 128
  ) {

    showMessage(
      "Invalid face descriptor.",
      "error"
    );

    captureButton.disabled = false;

    return;
  }


  const callbackName =
    "faceSaveCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      try {

        if (result.success) {

          status.textContent =
            "Face registration completed.";

          showMessage(
            result.message ||
            "Face registered successfully.",
            "success"
          );

        } else {

          status.textContent =
            "Registration failed.";

          showMessage(
            result.error ||
            "Unable to save face registration.",
            "error"
          );

        }

      } finally {

        captureButton.disabled = false;

        delete window[callbackName];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }

      }

    };


  const descriptorText =
    JSON.stringify(descriptor);


  const url =
    APPS_SCRIPT_URL +
    "?action=saveFace" +
    "&staffId=" +
    encodeURIComponent(staffId) +
    "&descriptor=" +
    encodeURIComponent(descriptorText) +
    "&callback=" +
    encodeURIComponent(callbackName);


  const script =
    document.createElement("script");

  script.id =
    callbackName;

  script.src =
    url;

  script.onerror =
    function() {

      showMessage(
        "Unable to connect to the attendance server.",
        "error"
      );

      captureButton.disabled =
        false;

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(script);

}

</script>

</body>

</html>
