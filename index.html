<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Staff Face Registration</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f3f4;
  color: #202124;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  font-size: 26px;
}

.header p {
  color: #666;
  font-size: 14px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

select {
  width: 100%;
  min-height: 48px;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

.camera {
  width: 100%;
  aspect-ratio: 4 / 3;
  margin-top: 18px;
  background: #111;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  display: none;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

.guide {
  position: absolute;
  width: 58%;
  height: 72%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border: 3px solid white;
  border-radius: 50%;
  pointer-events: none;
}

.status {
  text-align: center;
  margin: 16px 0;
  font-weight: bold;
}

.progress {
  text-align: center;
  margin: 10px 0;
  font-size: 15px;
}

button {
  width: 100%;
  min-height: 50px;
  border: none;
  border-radius: 10px;
  background: #1a73e8;
  color: white;
  font-size: 17px;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

button:disabled {
  background: #aaa;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
}

.success {
  display: block;
  background: #e6f4ea;
  color: #137333;
}

.error {
  display: block;
  background: #fce8e6;
  color: #b31412;
}

.warning {
  display: block;
  background: #fef7e0;
  color: #8a4b00;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Staff Face Registration</h1>

<p>Five-Sample Face Enrollment</p>

</div>

<div class="card">

<label for="staffSelect">
Select Staff Member
</label>

<select id="staffSelect">

<option value="">
Loading staff...
</option>

</select>


<button id="loadModels">
Load Face Recognition
</button>


<button id="startCamera"
        disabled>
Start Camera
</button>


<div id="cameraBox"
     class="camera">

<video id="video"
       autoplay
       muted
       playsinline>
</video>

<div class="guide"></div>

</div>


<div id="status"
     class="status">

Loading staff...

</div>


<div id="progress"
     class="progress">

0 / 5 samples

</div>


<button id="capture"
        disabled>

Capture Sample 1

</button>


<button id="save"
        disabled>

Save Five Samples

</button>


<div id="message"
     class="message">
</div>

</div>

</div>


<script>


const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzT-N64qGREd32KdznpyibHANy3VwJh25k2oeQ9hwVkLyAldKzDb5mB6ZHLXzvQ-DbC8A/exec";


const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


const staffSelect =
document.getElementById("staffSelect");

const loadModelsButton =
document.getElementById("loadModels");

const startCameraButton =
document.getElementById("startCamera");

const captureButton =
document.getElementById("capture");

const saveButton =
document.getElementById("save");

const video =
document.getElementById("video");

const cameraBox =
document.getElementById("cameraBox");

const status =
document.getElementById("status");

const progress =
document.getElementById("progress");

const message =
document.getElementById("message");


let modelsLoaded = false;

let cameraStream = null;

let samples = [];


/* =========================
   LOAD STAFF
========================= */

function loadStaff() {

const callbackName =
"staff_" + Date.now();

window[callbackName] =
function(result) {

try {

if (!result.success) {
throw new Error(result.error);
}

staffSelect.innerHTML =
'<option value="">Select staff member</option>';

result.staff.forEach(function(person) {

const option =
document.createElement("option");

option.value =
person.staffId;

option.textContent =
person.staffName +
" — " +
person.designation;

staffSelect.appendChild(option);

});

status.textContent =
"Select a staff member.";

}

catch(error) {

showMessage(
error.message,
"error"
);

}

finally {

delete window[callbackName];

const script =
document.getElementById(callbackName);

if (script) {
script.remove();
}

}

};


const script =
document.createElement("script");

script.id =
callbackName;

script.src =
APPS_SCRIPT_URL +
"?action=getStaff" +
"&callback=" +
encodeURIComponent(callbackName);

document.body.appendChild(script);

}


/* =========================
   LOAD MODELS
========================= */

loadModelsButton.addEventListener(
"click",
async function() {

loadModelsButton.disabled =
true;

status.textContent =
"Loading face recognition...";

try {

await faceapi.nets.tinyFaceDetector
.loadFromUri(MODEL_URL);

await faceapi.nets.faceLandmark68TinyNet
.loadFromUri(MODEL_URL);

await faceapi.nets.faceRecognitionNet
.loadFromUri(MODEL_URL);

modelsLoaded = true;

status.textContent =
"Face recognition ready.";

showMessage(
"Face recognition loaded.",
"success"
);

startCameraButton.disabled =
false;

}

catch(error) {

console.error(error);

loadModelsButton.disabled =
false;

showMessage(
"Unable to load face recognition models.",
"error"
);

}

});


/* =========================
   START CAMERA
========================= */

startCameraButton.addEventListener(
"click",
async function() {

if (!staffSelect.value) {

showMessage(
"Select a staff member first.",
"warning"
);

return;

}

try {

cameraStream =
await navigator.mediaDevices
.getUserMedia({

video: {
facingMode: "user",
width: { ideal: 640 },
height: { ideal: 480 }
},

audio: false

});

video.srcObject =
cameraStream;

cameraBox.style.display =
"block";

startCameraButton.disabled =
true;

captureButton.disabled =
false;

samples = [];

updateProgress();

status.textContent =
"Look directly at the camera.";

captureButton.textContent =
"Capture Sample 1";

}

catch(error) {

console.error(error);

showMessage(
"Camera access failed.",
"error"
);

}

});


/* =========================
   CAPTURE SAMPLE
========================= */

captureButton.addEventListener(
"click",
async function() {

if (samples.length >= 5) {
return;
}

captureButton.disabled =
true;

status.textContent =
"Detecting face...";

clearMessage();

try {

const detection =
await faceapi
.detectSingleFace(
video,
new faceapi.TinyFaceDetectorOptions({
inputSize: 320,
scoreThreshold: 0.5
})
)
.withFaceLandmarks(true)
.withFaceDescriptor();


if (!detection) {

throw new Error(
"No face detected. Look directly at the camera."
);

}


const descriptor =
Array.from(
detection.descriptor
)
.map(function(value) {

return Number(
Number(value).toFixed(6)
);

});


samples.push(descriptor);

updateProgress();


if (samples.length < 5) {

status.textContent =
"Sample captured. Change your head position slightly and capture again.";

captureButton.textContent =
"Capture Sample " +
(samples.length + 1);

captureButton.disabled =
false;

showMessage(
"Sample " +
samples.length +
" captured.",
"success"
);

}

else {

status.textContent =
"All five samples captured.";

captureButton.disabled =
true;

saveButton.disabled =
false;

showMessage(
"Five samples captured. You can now save the registration.",
"success"
);

}

}

catch(error) {

console.error(error);

status.textContent =
"Capture failed.";

showMessage(
error.message,
"warning"
);

captureButton.disabled =
false;

}

});


/* =========================
   SAVE SAMPLES
========================= */

saveButton.addEventListener(
"click",
function() {

if (samples.length !== 5) {

showMessage(
"Exactly five samples are required.",
"warning"
);

return;

}

const staffId =
staffSelect.value;

if (!staffId) {

showMessage(
"Select a staff member.",
"warning"
);

return;

}

saveButton.disabled =
true;

status.textContent =
"Saving five face samples...";


const callbackName =
"saveFace_" + Date.now();


window[callbackName] =
function(result) {

try {

if (!result.success) {
throw new Error(result.error);
}

status.textContent =
"Registration completed.";

showMessage(
result.message,
"success"
);

stopCamera();

}

catch(error) {

showMessage(
error.message,
"error"
);

saveButton.disabled =
false;

}

finally {

delete window[callbackName];

const script =
document.getElementById(callbackName);

if (script) {
script.remove();
}

}

};


const script =
document.createElement("script");

script.id =
callbackName;


script.src =
APPS_SCRIPT_URL +
"?action=saveFace" +
"&staffId=" +
encodeURIComponent(staffId) +
"&samples=" +
encodeURIComponent(
JSON.stringify(samples)
) +
"&callback=" +
encodeURIComponent(callbackName);


script.onerror =
function() {

showMessage(
"Unable to connect to Google Sheets.",
"error"
);

saveButton.disabled =
false;

delete window[callbackName];

script.remove();

};


document.body.appendChild(script);

});


/* =========================
   PROGRESS
========================= */

function updateProgress() {

progress.textContent =
samples.length +
" / 5 samples";

}


/* =========================
   STOP CAMERA
========================= */

function stopCamera() {

if (cameraStream) {

cameraStream
.getTracks()
.forEach(function(track) {

track.stop();

});

cameraStream = null;

}

video.srcObject = null;

cameraBox.style.display =
"none";

}


/* =========================
   UI
========================= */

function showMessage(
text,
type
) {

message.textContent =
text;

message.className =
"message " + type;

}


function clearMessage() {

message.textContent = "";

message.className =
"message";

}


/* =========================
   START
========================= */

loadStaff();

</script>

</body>

</html>
