<script>


/* =========================================================
   CONFIGURATION
========================================================= */


/*
 * Google Apps Script Web App
 */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzT-N64qGREd32KdznpyibHANy3VwJh25k2oeQ9hwVkLyAldKzDb5mB6ZHLXzvQ-DbC8A/exec";


/*
 * face-api.js model location
 */

const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


/* =========================================================
   SCHOOL LOCATION
========================================================= */

const SCHOOL_LATITUDE =
34.47299827097589;


const SCHOOL_LONGITUDE =
74.38414223492146;


/*
 * Staff must be within this distance.
 */

const GEO_RADIUS_METERS =
100;


/*
 * Maximum GPS uncertainty we accept.
 */

const MAX_GPS_ACCURACY_METERS =
100;


/* =========================================================
   FACE CONFIGURATION
========================================================= */

const MATCH_THRESHOLD =
0.50;


const LIVENESS_TIMEOUT =
25000;


const DETECTOR_OPTIONS =
new faceapi.TinyFaceDetectorOptions({

    inputSize: 320,

    scoreThreshold: 0.35

});


/* =========================================================
   ELEMENTS
========================================================= */

const startButton =
document.getElementById(
    "startButton"
);


const retryButton =
document.getElementById(
    "retryButton"
);


const cameraBox =
document.getElementById(
    "cameraBox"
);


const video =
document.getElementById(
    "video"
);


const status =
document.getElementById(
    "status"
);


const instruction =
document.getElementById(
    "instruction"
);


const progressBar =
document.getElementById(
    "progressBar"
);


const resultBox =
document.getElementById(
    "result"
);


const locationBox =
document.getElementById(
    "locationBox"
);


/* =========================================================
   VARIABLES
========================================================= */

let modelsLoaded =
false;


let registeredFaces =
[];


let cameraStream =
null;


let running =
false;


let processing =
false;


let detectionBusy =
false;


/*
 * Liveness.
 */

let livenessStage =
"IDLE";


let livenessTimer =
null;


let livenessTimeoutTimer =
null;


/*
 * Centre position.
 */

let centerX =
null;


/*
 * Movement.
 */

let movementDetected =
false;


/*
 * Current verified location.
 *
 * These values are sent to Apps Script.
 */

let currentLatitude =
null;


let currentLongitude =
null;


let currentAccuracy =
null;


let currentDistance =
null;


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    startAttendance
);


/* =========================================================
   RETRY BUTTON
========================================================= */

retryButton.addEventListener(

    function() {

        clearResult();

        retryButton.style.display =
            "none";

        startAttendance();

);


/* =========================================================
   START ATTENDANCE
========================================================= */

async function startAttendance() {

    if (running) {
        return;
    }


    running =
        true;


    processing =
        true;


    startButton.disabled =
        true;


    retryButton.style.display =
        "none";


    clearResult();


    clearLocation();


    setProgress(0);


    status.textContent =
        "Checking your location...";


    instruction.textContent =
        "Please allow location access if requested.";


    try {


        /*
         * STEP 1
         * Get current GPS location.
         */

        const location =
            await getCurrentLocation();


        currentLatitude =
            location.latitude;


        currentLongitude =
            location.longitude;


        currentAccuracy =
            location.accuracy;


        /*
         * Calculate distance on the browser.
         */

        currentDistance =
            calculateDistanceMeters(
                currentLatitude,
                currentLongitude,
                SCHOOL_LATITUDE,
                SCHOOL_LONGITUDE
            );


        console.log(
            "Latitude:",
            currentLatitude
        );


        console.log(
            "Longitude:",
            currentLongitude
        );


        console.log(
            "GPS Accuracy:",
            currentAccuracy
        );


        console.log(
            "Distance:",
            currentDistance
        );


        /*
         * STEP 2
         * Check GPS accuracy.
         */

        if (
            currentAccuracy >
            MAX_GPS_ACCURACY_METERS
        ) {

            throw new Error(

                "GPS accuracy is too low (" +

                Math.round(
                    currentAccuracy
                ) +

                " metres). " +

                "Please move to an open area and try again."

            );

        }


        /*
         * STEP 3
         * Check school geofence.
         */

        if (
            currentDistance >
            GEO_RADIUS_METERS
        ) {


            showLocationStatus(
                false
            );


            throw new Error(

                "Attendance is only allowed within " +

                GEO_RADIUS_METERS +

                " metres of the school. " +

                "Your current distance is approximately " +

                Math.round(
                    currentDistance
                ) +

                " metres."

            );

        }


        /*
         * Location is valid.
         */

        showLocationStatus(
            true
        );


        setProgress(10);


        status.textContent =
            "Location verified.";


        instruction.textContent =
            "Starting camera...";


        /*
         * STEP 4
         * Load face models.
         */

        await loadFaceModels();


        /*
         * STEP 5
         * Load registered faces.
         */

        status.textContent =
            "Loading registered staff...";


        instruction.textContent =
            "Please wait.";


        await loadRegisteredFaces();


        if (
            registeredFaces.length === 0
        ) {

            throw new Error(
                "No registered staff faces were found."
            );

        }


        /*
         * STEP 6
         * Start camera.
         */

        status.textContent =
            "Starting camera...";


        instruction.textContent =
            "Please wait.";


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "user",

                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        }

                    },

                    audio: false

                });


        video.srcObject =
            cameraStream;


        cameraBox.style.display =
            "block";


        await waitForVideo();


        processing =
            false;


        /*
         * STEP 7
         * Start face liveness.
         */

        startLiveness();


    }

    catch (error) {


        console.error(
            error
        );


        running =
            false;


        processing =
            false;


        stopCamera();


        startButton.disabled =
            false;


        status.textContent =
            "Unable to start attendance.";


        instruction.textContent =
            "";


        showResult(

            "<h2>Attendance Not Started</h2>" +

            "<p>" +
            escapeHtml(
                error.message ||
                "Unable to start attendance."
            ) +
            "</p>",

            "error"

        );

    }

}


/* =========================================================
   GET LOCATION
========================================================= */

function getCurrentLocation() {

    return new Promise(
        function(resolve, reject) {


            /*
             * Browser does not support geolocation.
             */

            if (
                !navigator.geolocation
            ) {

                reject(
                    new Error(
                        "This browser does not support location services."
                    )
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function(position) {


                    if (
                        !position ||
                        !position.coords
                    ) {

                        reject(
                            new Error(
                                "Unable to read your location."
                            )
                        );

                        return;

                    }


                    resolve({

                        latitude:
                            position.coords.latitude,

                        longitude:
                            position.coords.longitude,

                        accuracy:
                            position.coords.accuracy

                    });

                },


                function(error) {


                    let message =
                        "Unable to obtain your location.";


                    if (
                        error.code ===
                        error.PERMISSION_DENIED
                    ) {

                        message =
                            "Location permission was denied. Please allow location access for this website and try again.";

                    }

                    else if (
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ) {

                        message =
                            "Your location is currently unavailable. Please make sure Location Services are enabled and try again.";

                    }

                    else if (
                        error.code ===
                        error.TIMEOUT
                    ) {

                        message =
                            "Location request timed out. Please try again.";

                    }


                    reject(
                        new Error(
                            message
                        )
                    );

                },


                {

                    /*
                     * Ask for the most accurate
                     * location available.
                     */

                    enableHighAccuracy:
                        true,

                    timeout:
                        15000,

                    maximumAge:
                        0

                }

            );

        }
    );

}


/* =========================================================
   SHOW LOCATION STATUS
========================================================= */

function showLocationStatus(
    allowed
) {


    locationBox.style.display =
        "block";


    if (allowed) {


        locationBox.innerHTML =

            "<strong>Location Verified</strong>" +

            "<br>" +

            "You are approximately " +

            "<strong>" +

            Math.round(
                currentDistance
            ) +

            " metres</strong> from the attendance location." +

            "<br>" +

            "<small>GPS accuracy: approximately " +

            Math.round(
                currentAccuracy
            ) +

            " metres</small>";

    }

    else {


        locationBox.innerHTML =

            "<strong>Location Not Allowed</strong>" +

            "<br>" +

            "You are approximately " +

            Math.round(
                currentDistance
            ) +

            " metres from the attendance location.";

    }

}


/* =========================================================
   CLEAR LOCATION
========================================================= */

function clearLocation() {

    locationBox.style.display =
        "none";


    locationBox.innerHTML =
        "";


    currentLatitude =
        null;


    currentLongitude =
        null;


    currentAccuracy =
        null;


    currentDistance =
        null;

}


/* =========================================================
   HAVERSINE DISTANCE
========================================================= */

function calculateDistanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
) {


    const earthRadius =
        6371000;


    const toRadians =
        function(degrees) {

            return degrees *
                Math.PI /
                180;

        };


    const dLat =
        toRadians(
            lat2 - lat1
        );


    const dLon =
        toRadians(
            lon2 - lon1
        );


    const a =

        Math.sin(
            dLat / 2
        ) *

        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            toRadians(lat1)
        ) *

        Math.cos(
            toRadians(lat2)
        ) *

        Math.sin(
            dLon / 2
        ) *

        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return earthRadius * c;

}


/* =========================================================
   LOAD MODELS
========================================================= */

async function loadFaceModels() {


    if (
        modelsLoaded
    ) {

        return;

    }


    status.textContent =
        "Loading face detector...";


    await faceapi.nets
        .tinyFaceDetector
        .loadFromUri(
            MODEL_URL
        );


    status.textContent =
        "Loading face landmarks...";


    await faceapi.nets
        .faceLandmark68TinyNet
        .loadFromUri(
            MODEL_URL
        );


    status.textContent =
        "Loading face recognition...";


    await faceapi.nets
        .faceRecognitionNet
        .loadFromUri(
            MODEL_URL
        );


    modelsLoaded =
        true;

}


/* =========================================================
   LOAD REGISTERED FACES
========================================================= */

function loadRegisteredFaces() {

    return new Promise(
        function(resolve, reject) {


            const callbackName =
                "faces_" +
                Date.now();


            window[callbackName] =
                function(data) {


                    try {


                        if (
                            !data.success
                        ) {

                            throw new Error(
                                data.error ||
                                "Unable to load registered faces."
                            );

                        }


                        registeredFaces =
                            data.faces || [];


                        registeredFaces =
                            registeredFaces.filter(
                                function(person) {


                                    if (
                                        !person ||
                                        !person.staffId ||
                                        !person.staffName
                                    ) {

                                        return false;

                                    }


                                    if (
                                        !Array.isArray(
                                            person.samples
                                        )
                                    ) {

                                        return false;

                                    }


                                    return person.samples.some(
                                        function(sample) {

                                            return (
                                                Array.isArray(sample) &&
                                                sample.length === 128
                                            );

                                        }
                                    );

                                }
                            );


                        resolve();

                    }

                    catch (error) {

                        reject(error);

                    }

                    finally {


                        delete window[
                            callbackName
                        ];


                        const script =
                            document.getElementById(
                                callbackName
                            );


                        if (
                            script
                        ) {

                            script.remove();

                        }

                    }

                };


            const script =
                document.createElement(
                    "script"
                );


            script.id =
                callbackName;


            script.src =
                APPS_SCRIPT_URL +

                "?action=getFaces" +

                "&callback=" +

                encodeURIComponent(
                    callbackName
                );


            script.onerror =
                function() {


                    delete window[
                        callbackName
                    ];


                    script.remove();


                    reject(
                        new Error(
                            "Unable to connect to Google Sheets."
                        )
                    );

                };


            document.body.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   WAIT FOR VIDEO
========================================================= */

function waitForVideo() {

    return new Promise(
        function(resolve) {


            let attempts =
                0;


            const timer =
                setInterval(
                    function() {


                        attempts++;


                        if (
                            video.readyState >= 2 &&
                            video.videoWidth > 0
                        ) {


                            clearInterval(
                                timer
                            );


                            resolve();

                        }


                        if (
                            attempts > 50
                        ) {


                            clearInterval(
                                timer
                            );


                            resolve();

                        }

                    },
                    100
                );

        }
    );

}


/* =========================================================
   START LIVENESS
========================================================= */

function startLiveness() {


    stopLivenessTimers();


    livenessStage =
        "CENTER";


    centerX =
        null;


    movementDetected =
        false;


    detectionBusy =
        false;


    running =
        true;


    processing =
        false;


    retryButton.style.display =
        "none";


    status.textContent =
        "Looking for your face...";


    instruction.textContent =
        "Position your face inside the oval.";


    setProgress(15);


    livenessTimer =
        setInterval(
            checkLiveness,
            250
        );


    livenessTimeoutTimer =
        setTimeout(
            livenessFailed,
            LIVENESS_TIMEOUT
        );

}


/* =========================================================
   CHECK LIVENESS
========================================================= */

async function checkLiveness() {


    if (
        !running ||
        processing ||
        detectionBusy
    ) {

        return;

    }


    detectionBusy =
        true;


    try {


        const detection =
            await faceapi.detectSingleFace(
                video,
                DETECTOR_OPTIONS
            );


        /*
         * Face not detected.
         *
         * Camera remains open.
         */

        if (
            !detection
        ) {


            if (
                livenessStage ===
                "CENTER"
            ) {


                status.textContent =
                    "Looking for your face...";


                instruction.textContent =
                    "Position your face inside the oval.";

            }


            return;

        }


        const box =
            detection.box;


        /*
         * Face horizontal centre.
         */

        const faceX =
            (
                box.x +
                box.width / 2
            ) /
            video.videoWidth;


        /* =================================================
           CENTER
        ================================================= */

        if (
            livenessStage ===
            "CENTER"
        ) {


            if (
                centerX === null
            ) {


                centerX =
                    faceX;


                status.textContent =
                    "Face detected.";


                instruction.textContent =
                    "Keep looking at the camera.";


                setProgress(25);


                return;

            }


            /*
             * Move to next stage.
             */

            livenessStage =
                "MOVE";


            status.textContent =
                "Face detected.";


            instruction.textContent =
                "Move your face slightly to either side.";


            setProgress(30);


            return;

        }


        /* =================================================
           MOVE
        ================================================= */

        if (
            livenessStage ===
            "MOVE"
        ) {


            const movement =
                Math.abs(
                    faceX -
                    centerX
                );


            /*
             * Approximately 5.5% of the
             * camera width.
             */

            if (
                movement >
                0.055
            ) {


                movementDetected =
                    true;


                livenessStage =
                    "RETURN";


                status.textContent =
                    "Movement detected.";


                instruction.textContent =
                    "Now return your face to the centre.";


                setProgress(60);

            }


            return;

        }


        /* =================================================
           RETURN
        ================================================= */

        if (
            livenessStage ===
            "RETURN"
        ) {


            const movement =
                Math.abs(
                    faceX -
                    centerX
                );


            /*
             * Broad centre tolerance.
             */

            if (
                movement <
                0.12
            ) {


                livenessStage =
                    "VERIFY";


                status.textContent =
                    "Liveness verified.";


                instruction.textContent =
                    "Verifying your face...";


                setProgress(85);


                stopLivenessTimers();


                setTimeout(
                    verifyFace,
                    250
                );

            }


            return;

        }

    }

    catch (error) {


        console.error(
            "Liveness error:",
            error
        );

    }

    finally {

        detectionBusy =
            false;

    }

}


/* =========================================================
   VERIFY FACE
========================================================= */

async function verifyFace() {


    if (
        !running
    ) {

        return;

    }


    processing =
        true;


    status.textContent =
        "Matching your face...";


    instruction.textContent =
        "Please keep still.";


    setProgress(90);


    try {


        /*
         * Detect face + landmarks +
         * face descriptor.
         */

        const detection =
            await faceapi
                .detectSingleFace(
                    video,
                    DETECTOR_OPTIONS
                )
                .withFaceLandmarks(true)
                .withFaceDescriptor();


        if (
            !detection
        ) {


            throw new Error(
                "Face was lost. Please try again."
            );

        }


        const liveDescriptor =
            Array.from(
                detection.descriptor
            );


        let bestMatch =
            null;


        let bestDistance =
            Infinity;


        /*
         * Compare the live face with
         * every sample of every staff member.
         */

        registeredFaces.forEach(
            function(person) {


                if (
                    !Array.isArray(
                        person.samples
                    )
                ) {

                    return;

                }


                person.samples.forEach(
                    function(sample) {


                        if (
                            !Array.isArray(sample) ||
                            sample.length !== 128
                        ) {

                            return;

                        }


                        const distance =
                            faceapi.euclideanDistance(
                                liveDescriptor,
                                sample
                            );


                        console.log(
                            person.staffName +
                            " distance:",
                            distance
                        );


                        if (
                            distance <
                            bestDistance
                        ) {


                            bestDistance =
                                distance;


                            bestMatch =
                                person;

                        }

                    }
                );

            }
        );


        console.log(
            "BEST MATCH:",
            bestMatch
        );


        console.log(
            "BEST DISTANCE:",
            bestDistance
        );


        /*
         * Reject unknown face.
         */

        if (
            !bestMatch ||
            bestDistance >
            MATCH_THRESHOLD
        ) {


            status.textContent =
                "Face not recognized.";


            instruction.textContent =
                "Please try again.";


            showResult(

                "<h2>Face Not Recognized</h2>" +

                "<p>No registered staff member matched your face.</p>" +

                "<p>Match distance: " +

                Number(
                    bestDistance
                ).toFixed(4) +

                "</p>",

                "error"

            );


            resetAfterFailure();


            return;

        }


        /*
         * Face successfully recognized.
         */

        status.textContent =
            "Face verified.";


        instruction.textContent =
            "Recording attendance...";


        setProgress(95);


        sendAttendance(
            bestMatch,
            bestDistance
        );

    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "Verification failed.";


        instruction.textContent =
            "Please try again.";


        showResult(

            "<h2>Verification Failed</h2>" +

            "<p>" +

            escapeHtml(
                error.message ||
                "Unable to verify face."
            ) +

            "</p>",

            "error"

        );


        resetAfterFailure();

    }

}


/* =========================================================
   SEND ATTENDANCE
========================================================= */

function sendAttendance(
    person,
    distanceValue
) {


    /*
     * Make absolutely sure location exists
     * before sending attendance.
     */

    if (
        currentLatitude === null ||
        currentLongitude === null ||
        currentAccuracy === null
    ) {


        showResult(

            "<h2>Location Missing</h2>" +

            "<p>Your location could not be verified.</p>" +

            "<p>Please try again.</p>",

            "error"

        );


        resetAfterFailure();


        return;

    }


    /*
     * Final browser-side geofence check.
     */

    currentDistance =
        calculateDistanceMeters(
            currentLatitude,
            currentLongitude,
            SCHOOL_LATITUDE,
            SCHOOL_LONGITUDE
        );


    if (
        currentDistance >
        GEO_RADIUS_METERS
    ) {


        showResult(

            "<h2>Location Not Allowed</h2>" +

            "<p>You are approximately " +

            Math.round(
                currentDistance
            ) +

            " metres from the attendance location.</p>" +

            "<p>Attendance is allowed within " +

            GEO_RADIUS_METERS +

            " metres.</p>",

            "error"

        );


        resetAfterFailure();


        return;

    }


    const callbackName =
        "attendance_" +
        Date.now();


    window[callbackName] =
        function(data) {


            try {


                /*
                 * Attendance successful.
                 */

                if (
                    data.success
                ) {


                    status.textContent =
                        "Attendance recorded.";


                    instruction.textContent =
                        "";


                    setProgress(100);


                    showResult(

                        "<h2>Attendance Marked</h2>" +

                        "<p><strong>" +

                        escapeHtml(
                            person.staffName
                        ) +

                        "</strong></p>" +

                        "<p>Date: " +

                        escapeHtml(
                            data.date
                        ) +

                        "</p>" +

                        "<p>Time: " +

                        escapeHtml(
                            data.time
                        ) +

                        "</p>",

                        "success"

                    );


                    stopCamera();


                    running =
                        false;


                    processing =
                        false;


                    startButton.disabled =
                        false;

                }


                /*
                 * Location rejected by server.
                 */

                else if (
                    data.locationDenied
                ) {


                    status.textContent =
                        "Location not allowed.";


                    instruction.textContent =
                        "";


                    showResult(

                        "<h2>Location Not Allowed</h2>" +

                        "<p>" +

                        escapeHtml(
                            data.message ||
                            "Attendance is not allowed at your current location."
                        ) +

                        "</p>",

                        "error"

                    );


                    stopCamera();


                    running =
                        false;


                    processing =
                        false;


                    startButton.disabled =
                        false;

                }


                /*
                 * Duplicate attendance.
                 */

                else if (
                    data.duplicate
                ) {


                    status.textContent =
                        "Attendance already marked.";


                    instruction.textContent =
                        "";


                    showResult(

                        "<h2>Already Marked</h2>" +

                        "<p>" +

                        escapeHtml(
                            data.message
                        ) +

                        "</p>" +

                        "<p>First attendance time: " +

                        escapeHtml(
                            data.time
                        ) +

                        "</p>",

                        "warning"

                    );


                    stopCamera();


                    running =
                        false;


                    processing =
                        false;


                    startButton.disabled =
                        false;

                }


                /*
                 * Other server error.
                 */

                else {


                    status.textContent =
                        "Attendance failed.";


                    showResult(

                        data.error ||
                        "Unable to record attendance.",

                        "error"

                    );


                    resetAfterFailure();

                }

            }

            finally {


                delete window[
                    callbackName
                ];


                const script =
                    document.getElementById(
                        callbackName
                    );


                if (
                    script
                ) {

                    script.remove();

                }

            }

        };


    /*
     * Liveness + face verification.
     */

    const verification =
        "FACE_MATCH_" +

        Number(
            distanceValue
        ).toFixed(4) +

        "_LIVENESS_OK";


    /*
     * Build Apps Script URL.
     *
     * Location information is included.
     */

    const url =

        APPS_SCRIPT_URL +

        "?action=faceAttendance" +

        "&staffId=" +

        encodeURIComponent(
            person.staffId
        ) +

        "&verification=" +

        encodeURIComponent(
            verification
        ) +

        "&device=" +

        encodeURIComponent(
            getDevice()
        ) +

        "&latitude=" +

        encodeURIComponent(
            currentLatitude
        ) +

        "&longitude=" +

        encodeURIComponent(
            currentLongitude
        ) +

        "&accuracy=" +

        encodeURIComponent(
            currentAccuracy
        ) +

        "&callback=" +

        encodeURIComponent(
            callbackName
        );


    console.log(
        "Attendance request:",
        url
    );


    const script =
        document.createElement(
            "script"
        );


    script.id =
        callbackName;


    script.src =
        url;


    script.onerror =
        function() {


            delete window[
                callbackName
            ];


            script.remove();


            status.textContent =
                "Connection failed.";


            showResult(

                "<h2>Connection Failed</h2>" +

                "<p>Unable to connect to the attendance server.</p>" +

                "<p>Please try again.</p>",

                "error"

            );


            resetAfterFailure();

        };


    document.body.appendChild(
        script
    );

}


/* =========================================================
   LIVENESS FAILURE
========================================================= */

function livenessFailed() {


    if (
        !running ||
        processing
    ) {

        return;

    }


    stopLivenessTimers();


    status.textContent =
        "Liveness check was not completed.";


    instruction.textContent =
        "Tap Try Again.";


    showResult(

        "<h2>Try Again</h2>" +

        "<p>The face movement check was not completed.</p>" +

        "<p>Move your face slightly to either side and then return to the centre.</p>",

        "warning"

    );


    /*
     * IMPORTANT:
     *
     * Camera remains open.
     */

    retryButton.style.display =
        "block";


    processing =
        false;

}


/* =========================================================
   RESET AFTER FAILURE
========================================================= */

function resetAfterFailure() {


    stopLivenessTimers();


    /*
     * Keep camera open.
     */

    retryButton.style.display =
        "block";


    processing =
        false;


    status.textContent =
        "Verification failed.";


    instruction.textContent =
        "Tap Try Again.";

}


/* =========================================================
   STOP LIVENESS TIMERS
========================================================= */

function stopLivenessTimers() {


    if (
        livenessTimer
    ) {


        clearInterval(
            livenessTimer
        );


        livenessTimer =
            null;

    }


    if (
        livenessTimeoutTimer
    ) {


        clearTimeout(
            livenessTimeoutTimer
        );


        livenessTimeoutTimer =
            null;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {


    stopLivenessTimers();


    if (
        cameraStream
    ) {


        cameraStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        cameraStream =
            null;

    }


    video.srcObject =
        null;


    cameraBox.style.display =
        "none";

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(
    value
) {

    progressBar.style.width =
        value + "%";

}


/* =========================================================
   RESULT
========================================================= */

function showResult(
    html,
    type
) {

    resultBox.innerHTML =
        html;


    resultBox.className =
        "result " +
        type;

}


function clearResult() {

    resultBox.innerHTML =
        "";


    resultBox.className =
        "result";

}


/* =========================================================
   DEVICE
========================================================= */

function getDevice() {


    const ua =
        navigator.userAgent;


    if (
        /iPhone|iPad|iPod/i
            .test(ua)
    ) {

        return "iPhone/iPad";

    }


    if (
        /Android/i
            .test(ua)
    ) {

        return "Android";

    }


    if (
        /Windows/i
            .test(ua)
    ) {

        return "Windows";

    }


    if (
        /Mac/i
            .test(ua)
    ) {

        return "Mac";

    }


    return "Other";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
