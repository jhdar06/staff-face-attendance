<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Staff Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3f5;
    color: #202124;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 18px;
}

.header {
    text-align: center;
    margin-bottom: 16px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin-top: 7px;
    color: #666;
    font-size: 14px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

.camera {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #111;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    display: none;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

.guide {
    position: absolute;
    width: 58%;
    height: 72%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid white;
    border-radius: 50%;
    pointer-events: none;
}

.status {
    text-align: center;
    font-weight: bold;
    font-size: 17px;
    margin: 16px 0 7px;
    min-height: 25px;
}

.instruction {
    text-align: center;
    font-size: 15px;
    min-height: 45px;
    color: #555;
    margin-bottom: 10px;
    line-height: 1.45;
}

.progress {
    height: 8px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0 18px;
}

.progressBar {
    height: 100%;
    width: 0%;
    background: #1a73e8;
    transition: width .25s;
}

button {
    width: 100%;
    min-height: 52px;
    border: none;
    border-radius: 11px;
    background: #1a73e8;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.retryButton {
    background: #5f6368;
    display: none;
}

.result {
    display: none;
    margin-top: 17px;
    padding: 17px;
    border-radius: 13px;
    text-align: center;
}

.result h2 {
    margin: 0 0 8px;
    font-size: 21px;
}

.result p {
    margin: 6px 0;
    font-size: 15px;
}

.success {
    display: block;
    background: #e6f4ea;
    color: #137333;
}

.error {
    display: block;
    background: #fce8e6;
    color: #b31412;
}

.warning {
    display: block;
    background: #fef7e0;
    color: #8a4b00;
}

.small {
    font-size: 12px;
    color: #777;
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>Staff Attendance</h1>

<p>Face Authentication</p>

</div>


<div class="card">


<button id="startButton">
Start Attendance
</button>


<div id="cameraBox"
     class="camera">

<video id="video"
       autoplay
       muted
       playsinline>
</video>

<div class="guide"></div>

</div>


<div id="status"
     class="status">

Ready to start.

</div>


<div id="instruction"
     class="instruction">

Tap Start Attendance.

</div>


<div class="progress">

<div id="progressBar"
     class="progressBar">
</div>

</div>


<button id="retryButton"
        class="retryButton">

Try Again

</button>


<div id="result"
     class="result">
</div>


<div class="small">

Face authentication is performed in the browser.

</div>


</div>

</div>


<script>


/* =========================================================
   CONFIGURATION
========================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzT-N64qGREd32KdznpyibHANy3VwJh25k2oeQ9hwVkLyAldKzDb5mB6ZHLXzvQ-DbC8A/exec";


const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


/*
 * Face recognition threshold.
 *
 * Smaller distance = better match.
 */

const MATCH_THRESHOLD = 0.50;


/*
 * Maximum liveness time.
 */

const LIVENESS_TIMEOUT = 25000;


/*
 * Face detection.
 */

const DETECTOR_OPTIONS =
new faceapi.TinyFaceDetectorOptions({

    inputSize: 320,

    scoreThreshold: 0.35

});


/* =========================================================
   ELEMENTS
========================================================= */

const startButton =
document.getElementById(
    "startButton"
);

const retryButton =
document.getElementById(
    "retryButton"
);

const cameraBox =
document.getElementById(
    "cameraBox"
);

const video =
document.getElementById(
    "video"
);

const status =
document.getElementById(
    "status"
);

const instruction =
document.getElementById(
    "instruction"
);

const progressBar =
document.getElementById(
    "progressBar"
);

const resultBox =
document.getElementById(
    "result"
);


/* =========================================================
   VARIABLES
========================================================= */

let modelsLoaded = false;

let registeredFaces = [];

let cameraStream = null;

let running = false;

let processing = false;

let detectionBusy = false;


/*
 * Liveness stages.
 */

let livenessStage = "IDLE";

let livenessTimer = null;

let livenessTimeoutTimer = null;


/*
 * Initial face position.
 */

let centerX = null;


/*
 * Movement detection.
 */

let leftMovementDetected = false;

let rightMovementDetected = false;


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startAttendance
);


/* =========================================================
   RETRY
========================================================= */

retryButton.addEventListener(
    "click",
    function() {

        clearResult();

        retryButton.style.display =
            "none";

        startLiveness();

    }
);


/* =========================================================
   START ATTENDANCE
========================================================= */

async function startAttendance() {

    if (running) {
        return;
    }

    running = true;

    processing = true;

    startButton.disabled = true;

    retryButton.style.display = "none";

    clearResult();

    setProgress(0);

    status.textContent =
        "Preparing face recognition...";

    instruction.textContent =
        "Please wait.";

    try {

        await loadFaceModels();

        status.textContent =
            "Loading registered staff...";

        await loadRegisteredFaces();

        if (
            registeredFaces.length === 0
        ) {

            throw new Error(
                "No registered staff faces were found."
            );

        }

        status.textContent =
            "Starting camera...";

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: "user",

                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        }

                    },

                    audio: false

                });

        video.srcObject =
            cameraStream;

        cameraBox.style.display =
            "block";

        await waitForVideo();

        processing = false;

        startLiveness();

    }

    catch (error) {

        console.error(error);

        running = false;

        processing = false;

        startButton.disabled = false;

        status.textContent =
            "Unable to start.";

        instruction.textContent = "";

        showResult(
            error.message ||
            "Unable to start attendance.",
            "error"
        );

    }

}


/* =========================================================
   LOAD MODELS
========================================================= */

async function loadFaceModels() {

    if (modelsLoaded) {
        return;
    }

    status.textContent =
        "Loading face detector...";

    await faceapi.nets
        .tinyFaceDetector
        .loadFromUri(
            MODEL_URL
        );

    status.textContent =
        "Loading face recognition...";

    await faceapi.nets
        .faceRecognitionNet
        .loadFromUri(
            MODEL_URL
        );

    modelsLoaded = true;

}


/* =========================================================
   LOAD REGISTERED FACES
========================================================= */

function loadRegisteredFaces() {

    return new Promise(
        function(resolve, reject) {

            const callbackName =
                "faces_" +
                Date.now();

            window[callbackName] =
                function(data) {

                    try {

                        if (
                            !data.success
                        ) {

                            throw new Error(
                                data.error ||
                                "Unable to load registered faces."
                            );

                        }

                        registeredFaces =
                            data.faces || [];

                        registeredFaces =
                            registeredFaces.filter(
                                function(person) {

                                    if (
                                        !person ||
                                        !person.staffId ||
                                        !person.staffName
                                    ) {

                                        return false;

                                    }

                                    if (
                                        !Array.isArray(
                                            person.samples
                                        )
                                    ) {

                                        return false;

                                    }

                                    return person.samples.some(
                                        function(sample) {

                                            return (
                                                Array.isArray(sample) &&
                                                sample.length === 128
                                            );

                                        }
                                    );

                                }
                            );

                        resolve();

                    }

                    catch (error) {

                        reject(error);

                    }

                    finally {

                        delete window[
                            callbackName
                        ];

                        const script =
                            document.getElementById(
                                callbackName
                            );

                        if (script) {
                            script.remove();
                        }

                    }

                };


            const script =
                document.createElement(
                    "script"
                );


            script.id =
                callbackName;


            script.src =
                APPS_SCRIPT_URL +
                "?action=getFaces" +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                );


            script.onerror =
                function() {

                    delete window[
                        callbackName
                    ];

                    script.remove();

                    reject(
                        new Error(
                            "Unable to connect to Google Sheets."
                        )
                    );

                };


            document.body.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   WAIT FOR VIDEO
========================================================= */

function waitForVideo() {

    return new Promise(
        function(resolve) {

            let attempts = 0;

            const timer =
                setInterval(
                    function() {

                        attempts++;

                        if (
                            video.readyState >= 2 &&
                            video.videoWidth > 0
                        ) {

                            clearInterval(timer);

                            resolve();

                        }

                        if (
                            attempts > 50
                        ) {

                            clearInterval(timer);

                            resolve();

                        }

                    },
                    100
                );

        }
    );

}


/* =========================================================
   START LIVENESS
========================================================= */

function startLiveness() {

    stopLivenessTimers();

    livenessStage =
        "CENTER";

    centerX = null;

    leftMovementDetected = false;

    rightMovementDetected = false;

    detectionBusy = false;

    running = true;

    processing = false;

    retryButton.style.display =
        "none";

    status.textContent =
        "Looking for your face...";

    instruction.textContent =
        "Keep your face inside the oval.";

    setProgress(5);


    /*
     * Sequential detection.
     */

    livenessTimer =
        setInterval(
            checkLiveness,
            250
        );


    /*
     * Maximum 25 seconds.
     */

    livenessTimeoutTimer =
        setTimeout(
            livenessFailed,
            LIVENESS_TIMEOUT
        );

}


/* =========================================================
   CHECK LIVENESS
========================================================= */

async function checkLiveness() {

    if (
        !running ||
        processing ||
        detectionBusy
    ) {

        return;

    }

    detectionBusy = true;

    try {

        /*
         * We only need the face bounding box.
         *
         * No eye landmarks.
         * No blink detection.
         */

        const detection =
            await faceapi.detectSingleFace(
                video,
                DETECTOR_OPTIONS
            );


        /*
         * Face not detected.
         *
         * IMPORTANT:
         * Keep camera open.
         */

        if (!detection) {

            status.textContent =
                "Looking for your face...";

            instruction.textContent =
                "Position your face inside the oval.";

            return;

        }


        const box =
            detection.box;


        /*
         * Calculate face centre.
         */

        const faceX =
            (
                box.x +
                box.width / 2
            ) /
            video.videoWidth;


        /* =================================================
           STAGE 1
           CENTER
        ================================================= */

        if (
            livenessStage ===
            "CENTER"
        ) {

            if (
                centerX === null
            ) {

                centerX =
                    faceX;

                status.textContent =
                    "Face detected.";

                instruction.textContent =
                    "Keep looking at the camera.";

                setProgress(20);

                return;

            }


            /*
             * Give the camera several frames
             * to establish the centre.
             */

            livenessStage =
                "LEFT";


            status.textContent =
                "Face detected.";

            instruction.textContent =
                "Move your face slightly to the LEFT.";

            setProgress(30);

            return;

        }


        /* =================================================
           STAGE 2
           LEFT
        ================================================= */

        if (
            livenessStage ===
            "LEFT"
        ) {

            const movement =
                faceX -
                centerX;


            /*
             * User moves face to the left.
             *
             * Because the camera image is mirrored,
             * we accept either horizontal direction
             * here and simply call it "side".
             */

            if (
                Math.abs(movement) >
                0.07
            ) {

                leftMovementDetected =
                    true;


                livenessStage =
                    "RIGHT";


                status.textContent =
                    "Good.";

                instruction.textContent =
                    "Now move your face to the OTHER side.";

                setProgress(50);

            }

            return;

        }


        /* =================================================
           STAGE 3
           RIGHT / OTHER SIDE
        ================================================= */

        if (
            livenessStage ===
            "RIGHT"
        ) {

            const movement =
                faceX -
                centerX;


            /*
             * Require the face to move to
             * the opposite side.
             *
             * Approximately 14% total movement
             * from one side to the other.
             */

            if (
                Math.abs(movement) >
                0.13
            ) {

                rightMovementDetected =
                    true;


                livenessStage =
                    "RETURN";


                status.textContent =
                    "Good.";

                instruction.textContent =
                    "Now return your face to the centre.";

                setProgress(70);

            }

            return;

        }


        /* =================================================
           STAGE 4
           RETURN
        ================================================= */

        if (
            livenessStage ===
            "RETURN"
        ) {

            const movement =
                Math.abs(
                    faceX -
                    centerX
                );


            /*
             * Return reasonably close
             * to original position.
             */

            if (
                movement <
                0.10
            ) {

                livenessStage =
                    "VERIFY";


                status.textContent =
                    "Movement verified.";

                instruction.textContent =
                    "Verifying your face...";

                setProgress(85);


                stopLivenessTimers();


                setTimeout(
                    verifyFace,
                    200
                );

            }

            return;

        }

    }

    catch (error) {

        console.error(
            "Liveness error:",
            error
        );

    }

    finally {

        detectionBusy =
            false;

    }

}


/* =========================================================
   VERIFY FACE
========================================================= */

async function verifyFace() {

    if (!running) {
        return;
    }

    processing = true;

    status.textContent =
        "Matching your face...";

    instruction.textContent =
        "Please keep still.";

    setProgress(90);


    try {

        const detection =
            await faceapi
                .detectSingleFace(
                    video,
                    DETECTOR_OPTIONS
                )
                .withFaceDescriptor();


        if (!detection) {

            throw new Error(
                "Face was lost. Please try again."
            );

        }


        const liveDescriptor =
            Array.from(
                detection.descriptor
            );


        let bestMatch =
            null;


        let bestDistance =
            Infinity;


        /*
         * Compare against every registered
         * staff member and every sample.
         */

        registeredFaces.forEach(
            function(person) {

                if (
                    !Array.isArray(
                        person.samples
                    )
                ) {

                    return;

                }


                person.samples.forEach(
                    function(sample) {

                        if (
                            !Array.isArray(sample) ||
                            sample.length !== 128
                        ) {

                            return;

                        }


                        const distance =
                            faceapi.euclideanDistance(
                                liveDescriptor,
                                sample
                            );


                        console.log(
                            person.staffName +
                            " distance:",
                            distance
                        );


                        if (
                            distance <
                            bestDistance
                        ) {

                            bestDistance =
                                distance;

                            bestMatch =
                                person;

                        }

                    }
                );

            }
        );


        console.log(
            "BEST MATCH:",
            bestMatch
        );


        console.log(
            "BEST DISTANCE:",
            bestDistance
        );


        /*
         * Reject unknown face.
         */

        if (
            !bestMatch ||
            bestDistance >
            MATCH_THRESHOLD
        ) {

            status.textContent =
                "Face not recognized.";

            instruction.textContent =
                "Please try again.";

            showResult(

                "<h2>Face Not Recognized</h2>" +

                "<p>No registered staff member matched your face.</p>" +

                "<p>Match distance: " +
                Number(
                    bestDistance
                ).toFixed(4) +
                "</p>",

                "error"

            );


            resetAfterFailure();

            return;

        }


        /*
         * Face recognized.
         */

        status.textContent =
            "Face verified.";

        instruction.textContent =
            "Recording attendance...";

        setProgress(95);


        sendAttendance(
            bestMatch,
            bestDistance
        );

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Verification failed.";

        instruction.textContent =
            "Please try again.";

        showResult(
            error.message ||
            "Unable to verify face.",
            "error"
        );

        resetAfterFailure();

    }

}


/* =========================================================
   SEND ATTENDANCE
========================================================= */

function sendAttendance(
    person,
    distanceValue
) {

    const callbackName =
        "attendance_" +
        Date.now();


    window[callbackName] =
        function(data) {

            try {

                /*
                 * Successful attendance.
                 */

                if (
                    data.success
                ) {

                    status.textContent =
                        "Attendance recorded.";

                    instruction.textContent =
                        "";

                    setProgress(100);


                    showResult(

                        "<h2>Attendance Marked</h2>" +

                        "<p><strong>" +
                        escapeHtml(
                            person.staffName
                        ) +
                        "</strong></p>" +

                        "<p>Date: " +
                        escapeHtml(
                            data.date
                        ) +
                        "</p>" +

                        "<p>Time: " +
                        escapeHtml(
                            data.time
                        ) +
                        "</p>",

                        "success"

                    );


                    stopCamera();


                    running =
                        false;

                    processing =
                        false;

                    startButton.disabled =
                        false;

                }


                /*
                 * Duplicate attendance.
                 */

                else if (
                    data.duplicate
                ) {

                    status.textContent =
                        "Attendance already marked.";

                    instruction.textContent =
                        "";


                    showResult(

                        "<h2>Already Marked</h2>" +

                        "<p>" +
                        escapeHtml(
                            data.message
                        ) +
                        "</p>" +

                        "<p>First attendance time: " +
                        escapeHtml(
                            data.time
                        ) +
                        "</p>",

                        "warning"

                    );


                    stopCamera();


                    running =
                        false;

                    processing =
                        false;

                    startButton.disabled =
                        false;

                }


                /*
                 * Other server error.
                 */

                else {

                    status.textContent =
                        "Attendance failed.";

                    showResult(

                        data.error ||
                        "Unable to record attendance.",

                        "error"

                    );

                    resetAfterFailure();

                }

            }

            finally {

                delete window[
                    callbackName
                ];


                const script =
                    document.getElementById(
                        callbackName
                    );


                if (script) {
                    script.remove();
                }

            }

        };


    const verification =
        "FACE_MATCH_" +
        Number(
            distanceValue
        ).toFixed(4) +
        "_LIVENESS_OK";


    const url =
        APPS_SCRIPT_URL +

        "?action=faceAttendance" +

        "&staffId=" +
        encodeURIComponent(
            person.staffId
        ) +

        "&verification=" +
        encodeURIComponent(
            verification
        ) +

        "&device=" +
        encodeURIComponent(
            getDevice()
        ) +

        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    const script =
        document.createElement(
            "script"
        );


    script.id =
        callbackName;


    script.src =
        url;


    script.onerror =
        function() {

            delete window[
                callbackName
            ];

            script.remove();


            status.textContent =
                "Connection failed.";


            showResult(
                "Unable to connect to the attendance server.",
                "error"
            );


            resetAfterFailure();

        };


    document.body.appendChild(
        script
    );

}


/* =========================================================
   LIVENESS FAILED
========================================================= */

function livenessFailed() {

    if (
        !running ||
        processing
    ) {

        return;

    }


    stopLivenessTimers();


    status.textContent =
        "Liveness check was not completed.";


    instruction.textContent =
        "Tap Try Again.";


    showResult(

        "<h2>Try Again</h2>" +

        "<p>The movement check was not completed.</p>" +

        "<p>Move your face clearly from one side to the other and then return to the centre.</p>",

        "warning"

    );


    /*
     * Camera remains open.
     */

    retryButton.style.display =
        "block";


    processing =
        false;

}


/* =========================================================
   RESET AFTER FAILURE
========================================================= */

function resetAfterFailure() {

    stopLivenessTimers();


    /*
     * Keep camera open.
     */

    retryButton.style.display =
        "block";


    processing =
        false;


    status.textContent =
        "Verification failed.";


    instruction.textContent =
        "Tap Try Again.";

}


/* =========================================================
   STOP TIMERS
========================================================= */

function stopLivenessTimers() {

    if (
        livenessTimer
    ) {

        clearInterval(
            livenessTimer
        );

        livenessTimer =
            null;

    }


    if (
        livenessTimeoutTimer
    ) {

        clearTimeout(
            livenessTimeoutTimer
        );

        livenessTimeoutTimer =
            null;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    stopLivenessTimers();


    if (
        cameraStream
    ) {

        cameraStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        cameraStream =
            null;

    }


    video.srcObject =
        null;


    cameraBox.style.display =
        "none";

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(
    value
) {

    progressBar.style.width =
        value + "%";

}


/* =========================================================
   RESULT
========================================================= */

function showResult(
    html,
    type
) {

    resultBox.innerHTML =
        html;

    resultBox.className =
        "result " + type;

}


function clearResult() {

    resultBox.innerHTML =
        "";

    resultBox.className =
        "result";

}


/* =========================================================
   DEVICE
========================================================= */

function getDevice() {

    const ua =
        navigator.userAgent;


    if (
        /iPhone|iPad|iPod/i
            .test(ua)
    ) {

        return "iPhone/iPad";

    }


    if (
        /Android/i
            .test(ua)
    ) {

        return "Android";

    }


    if (
        /Windows/i
            .test(ua)
    ) {

        return "Windows";

    }


    if (
        /Mac/i
            .test(ua)
    ) {

        return "Mac";

    }


    return "Other";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
