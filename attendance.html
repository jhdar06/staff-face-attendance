<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Staff Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef3f5;
    color: #202124;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 18px;
}

.header {
    text-align: center;
    margin-bottom: 16px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin-top: 7px;
    color: #666;
    font-size: 14px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

.camera {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #111;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
    display: none;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

.guide {
    position: absolute;
    width: 58%;
    height: 72%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid white;
    border-radius: 50%;
    pointer-events: none;
}

.status {
    text-align: center;
    font-weight: bold;
    font-size: 17px;
    margin: 16px 0 7px;
    min-height: 25px;
}

.instruction {
    text-align: center;
    font-size: 15px;
    min-height: 44px;
    color: #555;
    margin-bottom: 10px;
    line-height: 1.45;
}

.progress {
    height: 8px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0 18px;
}

.progressBar {
    height: 100%;
    width: 0%;
    background: #1a73e8;
    transition: width .25s;
}

button {
    width: 100%;
    min-height: 52px;
    border: none;
    border-radius: 11px;
    background: #1a73e8;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.retryButton {
    background: #5f6368;
    display: none;
}

.result {
    display: none;
    margin-top: 17px;
    padding: 17px;
    border-radius: 13px;
    text-align: center;
}

.result h2 {
    margin: 0 0 8px;
    font-size: 21px;
}

.result p {
    margin: 6px 0;
    font-size: 15px;
}

.success {
    display: block;
    background: #e6f4ea;
    color: #137333;
}

.error {
    display: block;
    background: #fce8e6;
    color: #b31412;
}

.warning {
    display: block;
    background: #fef7e0;
    color: #8a4b00;
}

.info {
    display: block;
    background: #e8f0fe;
    color: #174ea6;
}

.small {
    font-size: 12px;
    color: #777;
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
}

</style>

</head>

Try Again

</div>

Face recognition is performed in the browser.
The attendance result is sent to the attendance server.

<script>


/* =========================================================
   CONFIGURATION
========================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzT-N64qGREd32KdznpyibHANy3VwJh25k2oeQ9hwVkLyAldKzDb5mB6ZHLXzvQ-DbC8A/exec";


const MODEL_URL =
"https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


/*
 * Face recognition threshold.
 *
 * Lower number = stricter match.
 *
 * We will calibrate this later after testing
 * several staff members.
 */

const MATCH_THRESHOLD = 0.50;


/*
 * Maximum time allowed for liveness.
 */

const LIVENESS_TIMEOUT = 25000;


/*
 * Face detector settings.
 *
 * 0.35 is intentionally tolerant for mobile
 * cameras.
 */

const DETECTOR_OPTIONS =
new faceapi.TinyFaceDetectorOptions({

    inputSize: 320,

    scoreThreshold: 0.35

});


/* =========================================================
   ELEMENTS
========================================================= */

const startButton =
document.getElementById(
    "startButton"
);


const retryButton =
document.getElementById(
    "retryButton"
);


const cameraBox =
document.getElementById(
    "cameraBox"
);


const video =
document.getElementById(
    "video"
);


const status =
document.getElementById(
    "status"
);


const instruction =
document.getElementById(
    "instruction"
);


const progressBar =
document.getElementById(
    "progressBar"
);


const resultBox =
document.getElementById(
    "result"
);


/* =========================================================
   VARIABLES
========================================================= */

let modelsLoaded =
false;


let registeredFaces =
[];


let cameraStream =
null;


let running =
false;


let processing =
false;


/*
 * Liveness.
 */

let livenessStage =
"IDLE";


let livenessTimer =
null;


let livenessTimeoutTimer =
null;


let detectionBusy =
false;


/*
 * Face position baseline.
 */

let baselineX =
null;


let baselineFaceWidth =
null;


let baselineFrames =
0;


/*
 * Head movement.
 */

let headMoved =
false;


/*
 * Blink.
 */

let eyeBaseline =
null;


let eyeSamples =
0;


let blinkReady =
false;


let blinkClosed =
false;


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    startAttendance
);


/* =========================================================
   RETRY BUTTON
========================================================= */

retryButton.addEventListener(
    "click",
    function() {

        clearResult();

        retryButton.style.display =
            "none";

        startLiveness();

    }
);


/* =========================================================
   START ATTENDANCE
========================================================= */

async function startAttendance() {


    if (running) {
        return;
    }


    running =
        true;


    processing =
        true;


    startButton.disabled =
        true;


    retryButton.style.display =
        "none";


    clearResult();


    setProgress(0);


    status.textContent =
        "Preparing face recognition...";


    instruction.textContent =
        "Please wait.";


    try {


        /*
         * Load models.
         */

        await loadFaceModels();


        /*
         * Load registered faces.
         */

        status.textContent =
            "Loading registered staff...";


        instruction.textContent =
            "Please wait.";


        await loadRegisteredFaces();


        if (
            registeredFaces.length === 0
        ) {

            throw new Error(
                "No registered staff faces were found."
            );

        }


        /*
         * Start camera.
         */

        status.textContent =
            "Starting camera...";


        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: "user",

                        width: {
                            ideal: 640
                        },

                        height: {
                            ideal: 480
                        }

                    },

                    audio: false

                });


        video.srcObject =
            cameraStream;


        cameraBox.style.display =
            "block";


        /*
         * Wait until video actually has
         * dimensions.
         */

        await waitForVideo();


        processing =
            false;


        startLiveness();


    }

    catch (error) {


        console.error(error);


        running =
            false;


        processing =
            false;


        startButton.disabled =
            false;


        status.textContent =
            "Unable to start.";


        instruction.textContent =
            "";


        showResult(
            error.message ||
            "Unable to start attendance.",
            "error"
        );

    }

}


/* =========================================================
   LOAD MODELS
========================================================= */

async function loadFaceModels() {


    if (modelsLoaded) {
        return;
    }


    status.textContent =
        "Loading face detector...";


    await faceapi.nets
        .tinyFaceDetector
        .loadFromUri(
            MODEL_URL
        );


    status.textContent =
        "Loading face landmarks...";


    await faceapi.nets
        .faceLandmark68TinyNet
        .loadFromUri(
            MODEL_URL
        );


    status.textContent =
        "Loading face recognition...";


    await faceapi.nets
        .faceRecognitionNet
        .loadFromUri(
            MODEL_URL
        );


    modelsLoaded =
        true;

}


/* =========================================================
   WAIT FOR VIDEO
========================================================= */

function waitForVideo() {


    return new Promise(
        function(resolve) {


            let attempts =
                0;


            const timer =
                setInterval(
                    function() {


                        attempts++;


                        if (
                            video.readyState >= 2 &&
                            video.videoWidth > 0 &&
                            video.videoHeight > 0
                        ) {

                            clearInterval(
                                timer
                            );


                            resolve();

                        }


                        /*
                         * Don't wait forever.
                         */

                        if (
                            attempts > 50
                        ) {

                            clearInterval(
                                timer
                            );


                            resolve();

                        }

                    },
                    100
                );

        }
    );

}


/* =========================================================
   LOAD REGISTERED FACES
========================================================= */

function loadRegisteredFaces() {


    return new Promise(
        function(resolve, reject) {


            const callbackName =
                "faces_" +
                Date.now();


            window[callbackName] =
                function(data) {


                    try {


                        if (
                            !data.success
                        ) {

                            throw new Error(
                                data.error ||
                                "Unable to load registered faces."
                            );

                        }


                        registeredFaces =
                            data.faces || [];


                        /*
                         * Only accept valid multi-sample
                         * templates.
                         */

                        registeredFaces =
                            registeredFaces.filter(
                                function(person) {


                                    if (
                                        !person ||
                                        !person.staffId ||
                                        !person.staffName
                                    ) {

                                        return false;

                                    }


                                    if (
                                        !Array.isArray(
                                            person.samples
                                        )
                                    ) {

                                        return false;

                                    }


                                    return person.samples.some(
                                        function(sample) {

                                            return (
                                                Array.isArray(sample) &&
                                                sample.length === 128
                                            );

                                        }
                                    );

                                }
                            );


                        resolve();

                    }

                    catch (error) {

                        reject(error);

                    }

                    finally {


                        delete window[
                            callbackName
                        ];


                        const script =
                            document.getElementById(
                                callbackName
                            );


                        if (script) {
                            script.remove();
                        }

                    }

                };


            const script =
                document.createElement(
                    "script"
                );


            script.id =
                callbackName;


            script.src =
                APPS_SCRIPT_URL +
                "?action=getFaces" +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                );


            script.onerror =
                function() {


                    delete window[
                        callbackName
                    ];


                    script.remove();


                    reject(
                        new Error(
                            "Unable to connect to Google Sheets."
                        )
                    );

                };


            document.body.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   START LIVENESS
========================================================= */

function startLiveness() {


    /*
     * Clear previous timers.
     */

    stopLivenessTimers();


    /*
     * Reset everything.
     */

    livenessStage =
        "BASELINE";


    baselineX =
        null;


    baselineFaceWidth =
        null;


    baselineFrames =
        0;


    headMoved =
        false;


    eyeBaseline =
        null;


    eyeSamples =
        0;


    blinkReady =
        false;


    blinkClosed =
        false;


    detectionBusy =
        false;


    running =
        true;


    processing =
        false;


    retryButton.style.display =
        "none";


    status.textContent =
        "Looking for your face...";


    instruction.textContent =
        "Position your face inside the oval.";


    setProgress(5);


    /*
     * Start sequential detection loop.
     */

    livenessTimer =
        setInterval(
            checkLivenessFrame,
            250
        );


    /*
     * Give the user 25 seconds.
     */

    livenessTimeoutTimer =
        setTimeout(
            livenessFailed,
            LIVENESS_TIMEOUT
        );

}


/* =========================================================
   LIVENESS FRAME
========================================================= */

async function checkLivenessFrame() {


    if (
        !running ||
        processing ||
        detectionBusy
    ) {

        return;

    }


    detectionBusy =
        true;


    try {


        /*
         * Detect the face.
         *
         * We intentionally do NOT require
         * landmarks for the initial detection.
         */

        const detection =
            await faceapi
                .detectSingleFace(
                    video,
                    DETECTOR_OPTIONS
                )
                .withFaceLandmarks(true);


        /*
         * No face.
         */

        if (!detection) {


            if (
                livenessStage ===
                "BASELINE"
            ) {

                status.textContent =
                    "Looking for your face...";

                instruction.textContent =
                    "Position your face inside the oval.";

            }


            return;

        }


        const box =
            detection.detection.box;


        const landmarks =
            detection.landmarks;


        /*
         * Face centre and size.
         */

        const faceCenterX =
            box.x +
            (
                box.width / 2
            );


        const normalizedX =
            faceCenterX /
            video.videoWidth;


        const faceWidth =
            box.width /
            video.videoWidth;


        /* =================================================
           STAGE 1
           ESTABLISH FACE
        ================================================= */

        if (
            livenessStage ===
            "BASELINE"
        ) {


            baselineFrames++;


            /*
             * Smooth the initial baseline.
             */

            if (
                baselineX === null
            ) {

                baselineX =
                    normalizedX;

            }

            else {

                baselineX =
                    (
                        baselineX * 0.80
                    ) +
                    (
                        normalizedX * 0.20
                    );

            }


            if (
                baselineFaceWidth === null
            ) {

                baselineFaceWidth =
                    faceWidth;

            }

            else {

                baselineFaceWidth =
                    (
                        baselineFaceWidth * 0.80
                    ) +
                    (
                        faceWidth * 0.20
                    );

            }


            status.textContent =
                "Face detected.";


            instruction.textContent =
                "Keep your face inside the oval.";


            setProgress(
                Math.min(
                    25,
                    5 +
                    baselineFrames * 4
                )
            );


            /*
             * Only 5 good frames needed.
             */

            if (
                baselineFrames >= 5
            ) {


                livenessStage =
                    "MOVE";


                status.textContent =
                    "Face detected.";


                instruction.textContent =
                    "Now turn your head slightly left or right.";


                setProgress(30);

            }


            return;

        }


        /* =================================================
           STAGE 2
           HEAD MOVEMENT
        ================================================= */

        if (
            livenessStage ===
            "MOVE"
        ) {


            /*
             * Horizontal movement of the face
             * relative to the initial position.
             */

            const movement =
                Math.abs(
                    normalizedX -
                    baselineX
                );


            /*
             * Also consider a modest change
             * in apparent face width.
             */

            const sizeChange =
                Math.abs(
                    faceWidth -
                    baselineFaceWidth
                );


            /*
             * Either horizontal movement or
             * slight distance change is enough.
             */

            if (
                movement > 0.055 ||
                sizeChange > 0.10
            ) {


                headMoved =
                    true;


                livenessStage =
                    "RETURN";


                status.textContent =
                    "Good.";


                instruction.textContent =
                    "Now look straight at the camera again.";


                setProgress(50);

            }


            return;

        }


        /* =================================================
           STAGE 3
           RETURN
        ================================================= */

        if (
            livenessStage ===
            "RETURN"
        ) {


            const movement =
                Math.abs(
                    normalizedX -
                    baselineX
                );


            /*
             * More tolerant centre range.
             */

            if (
                movement < 0.12
            ) {


                livenessStage =
                    "BLINK";


                eyeBaseline =
                    null;


                eyeSamples =
                    0;


                blinkReady =
                    false;


                blinkClosed =
                    false;


                status.textContent =
                    "Good.";


                instruction.textContent =
                    "Now close and open your eyes once.";


                setProgress(65);

            }


            return;

        }


        /* =================================================
           STAGE 4
           BLINK
        ================================================= */

        if (
            livenessStage ===
            "BLINK"
        ) {


            const ear =
                calculateEAR(
                    landmarks
                );


            /*
             * Establish normal eye opening.
             */

            if (
                !blinkReady
            ) {


                if (
                    eyeBaseline === null
                ) {

                    eyeBaseline =
                        ear;

                }

                else {

                    eyeBaseline =
                        (
                            eyeBaseline * 0.80
                        ) +
                        (
                            ear * 0.20
                        );

                }


                eyeSamples++;


                status.textContent =
                    "Eyes detected.";


                instruction.textContent =
                    "Now close and open your eyes once.";


                /*
                 * Only four samples needed.
                 */

                if (
                    eyeSamples >= 4
                ) {

                    blinkReady =
                        true;

                }


                return;

            }


            /*
             * Dynamic thresholds.
             */

            const closeThreshold =
                Math.max(
                    eyeBaseline * 0.72,
                    0.15
                );


            const openThreshold =
                Math.max(
                    eyeBaseline * 0.84,
                    0.19
                );


            /*
             * Eyes closing.
             */

            if (
                ear <
                closeThreshold
            ) {

                blinkClosed =
                    true;

                return;

            }


            /*
             * Eyes opened after closing.
             */

            if (
                blinkClosed &&
                ear >
                openThreshold
            ) {


                livenessStage =
                    "VERIFY";


                status.textContent =
                    "Liveness verified.";


                instruction.textContent =
                    "Verifying your face...";


                setProgress(85);


                stopLivenessTimers();


                setTimeout(
                    verifyFace,
                    200
                );

            }

        }

    }

    catch (error) {


        console.error(
            "Liveness detection error:",
            error
        );


        /*
         * Do not close the camera because
         * of one detection error.
         */

    }

    finally {

        detectionBusy =
            false;

    }

}


/* =========================================================
   CALCULATE EAR
========================================================= */

function calculateEAR(
    landmarks
) {


    const positions =
        landmarks.positions;


    const leftEAR =
        eyeAspectRatio(
            positions,
            36,
            37,
            38,
            39,
            40,
            41
        );


    const rightEAR =
        eyeAspectRatio(
            positions,
            42,
            43,
            44,
            45,
            46,
            47
        );


    return (
        leftEAR +
        rightEAR
    ) / 2;

}


/* =========================================================
   EYE ASPECT RATIO
========================================================= */

function eyeAspectRatio(
    points,
    p1,
    p2,
    p3,
    p4,
    p5,
    p6
) {


    const vertical1 =
        distance(
            points[p2],
            points[p6]
        );


    const vertical2 =
        distance(
            points[p3],
            points[p5]
        );


    const horizontal =
        distance(
            points[p1],
            points[p4]
        );


    if (
        horizontal <= 0
    ) {

        return 1;

    }


    return (
        vertical1 +
        vertical2
    ) /
    (
        2 *
        horizontal
    );

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(
    a,
    b
) {


    const dx =
        a.x -
        b.x;


    const dy =
        a.y -
        b.y;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   VERIFY FACE
========================================================= */

async function verifyFace() {


    if (!running) {
        return;
    }


    processing =
        true;


    status.textContent =
        "Matching your face...";


    instruction.textContent =
        "Please keep still.";


    setProgress(90);


    try {


        /*
         * Get a fresh descriptor.
         */

        const detection =
            await faceapi
                .detectSingleFace(
                    video,
                    DETECTOR_OPTIONS
                )
                .withFaceLandmarks(true)
                .withFaceDescriptor();


        if (!detection) {

            throw new Error(
                "Face was lost. Please try again."
            );

        }


        const liveDescriptor =
            Array.from(
                detection.descriptor
            );


        let bestMatch =
            null;


        let bestDistance =
            Infinity;


        /*
         * Compare with EVERY sample.
         */

        registeredFaces.forEach(
            function(person) {


                if (
                    !Array.isArray(
                        person.samples
                    )
                ) {

                    return;

                }


                person.samples.forEach(
                    function(sample) {


                        if (
                            !Array.isArray(sample) ||
                            sample.length !== 128
                        ) {

                            return;

                        }


                        const currentDistance =
                            faceapi.euclideanDistance(
                                liveDescriptor,
                                sample
                            );


                        console.log(
                            person.staffName +
                            " distance:",
                            currentDistance
                        );


                        if (
                            currentDistance <
                            bestDistance
                        ) {

                            bestDistance =
                                currentDistance;


                            bestMatch =
                                person;

                        }

                    }
                );

            }
        );


        console.log(
            "Best match:",
            bestMatch
        );


        console.log(
            "Best distance:",
            bestDistance
        );


        /*
         * No matching staff member.
         */

        if (
            !bestMatch ||
            bestDistance >
            MATCH_THRESHOLD
        ) {


            status.textContent =
                "Face not recognized.";


            instruction.textContent =
                "Please try again.";


            showResult(

                "<h2>Face Not Recognized</h2>" +

                "<p>No registered staff member matched your face.</p>" +

                "<p>Match distance: " +
                Number(
                    bestDistance
                ).toFixed(4) +
                "</p>",

                "error"

            );


            resetAfterFailure();


            return;

        }


        /*
         * Face successfully identified.
         */

        status.textContent =
            "Face verified.";


        instruction.textContent =
            "Recording attendance...";


        setProgress(95);


        sendAttendance(
            bestMatch,
            bestDistance
        );

    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "Verification failed.";


        instruction.textContent =
            "Please try again.";


        showResult(
            error.message ||
            "Unable to verify face.",
            "error"
        );


        resetAfterFailure();

    }

}


/* =========================================================
   SEND ATTENDANCE
========================================================= */

function sendAttendance(
    person,
    distanceValue
) {


    const callbackName =
        "attendance_" +
        Date.now();


    window[callbackName] =
        function(data) {


            try {


                /*
                 * Attendance successfully recorded.
                 */

                if (
                    data.success
                ) {


                    status.textContent =
                        "Attendance recorded.";


                    instruction.textContent =
                        "";


                    setProgress(100);


                    showResult(

                        "<h2>Attendance Marked</h2>" +

                        "<p><strong>" +
                        escapeHtml(
                            person.staffName
                        ) +
                        "</strong></p>" +

                        "<p>Date: " +
                        escapeHtml(
                            data.date
                        ) +
                        "</p>" +

                        "<p>Time: " +
                        escapeHtml(
                            data.time
                        ) +
                        "</p>",

                        "success"

                    );


                    stopCamera();


                    running =
                        false;


                    processing =
                        false;


                    startButton.disabled =
                        false;


                }


                /*
                 * Duplicate attendance.
                 */

                else if (
                    data.duplicate
                ) {


                    status.textContent =
                        "Attendance already marked.";


                    instruction.textContent =
                        "";


                    showResult(

                        "<h2>Already Marked</h2>" +

                        "<p>" +
                        escapeHtml(
                            data.message
                        ) +
                        "</p>" +

                        "<p>First attendance time: " +
                        escapeHtml(
                            data.time
                        ) +
                        "</p>",

                        "warning"

                    );


                    stopCamera();


                    running =
                        false;


                    processing =
                        false;


                    startButton.disabled =
                        false;


                }


                /*
                 * Server error.
                 */

                else {


                    status.textContent =
                        "Attendance failed.";


                    showResult(

                        data.error ||
                        "Unable to record attendance.",

                        "error"

                    );


                    resetAfterFailure();

                }

            }

            finally {


                delete window[
                    callbackName
                ];


                const script =
                    document.getElementById(
                        callbackName
                    );


                if (script) {
                    script.remove();
                }

            }

        };


    const verification =
        "FACE_MATCH_" +
        Number(
            distanceValue
        ).toFixed(4) +
        "_LIVENESS_OK";


    const url =
        APPS_SCRIPT_URL +

        "?action=faceAttendance" +

        "&staffId=" +
        encodeURIComponent(
            person.staffId
        ) +

        "&verification=" +
        encodeURIComponent(
            verification
        ) +

        "&device=" +
        encodeURIComponent(
            getDevice()
        ) +

        "&callback=" +
        encodeURIComponent(
            callbackName
        );


    const script =
        document.createElement(
            "script"
        );


    script.id =
        callbackName;


    script.src =
        url;


    script.onerror =
        function() {


            delete window[
                callbackName
            ];


            script.remove();


            status.textContent =
                "Connection failed.";


            showResult(
                "Unable to connect to the attendance server.",
                "error"
            );


            resetAfterFailure();

        };


    document.body.appendChild(
        script
    );

}


/* =========================================================
   LIVENESS FAILURE
========================================================= */

function livenessFailed() {


    if (
        !running ||
        processing
    ) {

        return;

    }


    stopLivenessTimers();


    /*
     * IMPORTANT:
     *
     * Do NOT close the camera.
     */

    status.textContent =
        "Liveness check was not completed.";


    instruction.textContent =
        "Follow the instructions and try again.";


    showResult(

        "<h2>Try Again</h2>" +

        "<p>The camera is still active.</p>" +

        "<p>Keep your face clearly visible, turn your head slightly, return to the centre and blink once.</p>",

        "warning"

    );


    retryButton.style.display =
        "block";


    processing =
        false;

}


/* =========================================================
   RESET AFTER FAILURE
========================================================= */

function resetAfterFailure() {


    stopLivenessTimers();


    /*
     * Keep camera open.
     */

    retryButton.style.display =
        "block";


    processing =
        false;


    status.textContent =
        "Verification failed.";


    instruction.textContent =
        "Tap Try Again.";

}


/* =========================================================
   STOP LIVENESS TIMERS
========================================================= */

function stopLivenessTimers() {


    if (
        livenessTimer
    ) {

        clearInterval(
            livenessTimer
        );


        livenessTimer =
            null;

    }


    if (
        livenessTimeoutTimer
    ) {

        clearTimeout(
            livenessTimeoutTimer
        );


        livenessTimeoutTimer =
            null;

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {


    stopLivenessTimers();


    if (
        cameraStream
    ) {


        cameraStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        cameraStream =
            null;

    }


    video.srcObject =
        null;


    cameraBox.style.display =
        "none";

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(
    value
) {

    progressBar.style.width =
        value + "%";

}


/* =========================================================
   RESULT
========================================================= */

function showResult(
    html,
    type
) {

    resultBox.innerHTML =
        html;


    resultBox.className =
        "result " +
        type;

}


function clearResult() {

    resultBox.innerHTML =
        "";


    resultBox.className =
        "result";

}


/* =========================================================
   DEVICE
========================================================= */

function getDevice() {


    const ua =
        navigator.userAgent;


    if (
        /iPhone|iPad|iPod/i
            .test(ua)
    ) {

        return "iPhone/iPad";

    }


    if (
        /Android/i
            .test(ua)
    ) {

        return "Android";

    }


    if (
        /Windows/i
            .test(ua)
    ) {

        return "Windows";

    }


    if (
        /Mac/i
            .test(ua)
    ) {

        return "Mac";

    }


    return "Other";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
